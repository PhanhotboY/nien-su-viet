syntax = "proto3";

package billing_service;

import "billing_service/billing.proto";
import "billing_service/payment_transactions.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/phanhotboy/nien-su-viet/libs/pkg/grpc/genproto/billing_service;billing_service";

enum PaymentAttemptStatus {
  PAYMENT_ATTEMPT_STATUS_UNSPECIFIED = 0;
  PAYMENT_ATTEMPT_STATUS_CREATED = 1;
  PAYMENT_ATTEMPT_STATUS_PENDING = 2;
  PAYMENT_ATTEMPT_STATUS_SUCCEEDED = 3;
  PAYMENT_ATTEMPT_STATUS_FAILED = 4;
  PAYMENT_ATTEMPT_STATUS_EXPIRED = 5;
  PAYMENT_ATTEMPT_STATUS_CANCELED = 6;
}

message PaymentAttempt {
  string id = 1;

  string purchase_id = 2;

  string provider = 3; // "stripe", "momo", "zalopay"
  PaymentAttemptStatus status = 4;

  billing_service.Money amount = 5;

  string provider_transaction_id = 6; // session/order id
  string checkout_url = 7;

  google.protobuf.Struct provider_metadata = 8;

  google.protobuf.Timestamp expires_at = 9;

  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// ============================================================================
// Payment Service (attempts + refund initiation)
// ============================================================================

message CreatePaymentAttemptRequest {
  string purchase_id = 1;

  // Which provider to use for this attempt ("momo", "zalopay", "stripe", ...)
  string provider = 2;

  // Optional: specify amounts if you allow partial payments; otherwise server
  // should take from purchase.amount.
  Money amount = 3;

  // Extra provider-specific options (return URLs, locale, bank code, etc.)
  google.protobuf.Struct provider_options = 4;

  // Recommended: idempotency key for attempt creation
  string idempotency_key = 5;
}

message CreatePaymentAttemptResponse {
  PaymentAttempt payment_attempt = 1;
}

message GetPaymentAttemptRequest {
  string payment_attempt_id = 1;
}

message GetPaymentAttemptResponse {
  PaymentAttempt payment_attempt = 1;
}

message ListPaymentAttemptsByPurchaseRequest {
  string purchase_id = 1;
}

message ListPaymentAttemptsByPurchaseResponse {
  repeated PaymentAttempt payment_attempts = 1;
}

// Initiate a refund for a specific purchase.
// Server should:
// - locate successful attempt(s) for that purchase,
// - pick the capture transaction(s),
// - call provider API,
// - record refund transaction(s).
message RefundPurchaseRequest {
  string purchase_id = 1;

  // If empty => full refund (server decides amount)
  // If set => partial refund (must be <= captured - already_refunded)
  Money amount = 2;

  // Optional free-form reason
  string reason = 3;

  // Idempotency for refund requests
  string idempotency_key = 4;

  // Optional: force a particular provider rail.
  // If set, server must ensure the purchase was paid via this provider, otherwise error.
  string provider = 5;
}

message RefundPurchaseResponse {
  // The refund transaction(s) created as a result.
  // Some providers may create multiple records (fees, partials, etc.)
  repeated PaymentTransaction refund_transactions = 1;
}

service PaymentService {
  rpc CreatePaymentAttempt(CreatePaymentAttemptRequest) returns (CreatePaymentAttemptResponse);
  rpc GetPaymentAttempt(GetPaymentAttemptRequest) returns (GetPaymentAttemptResponse);
  rpc ListPaymentAttemptsByPurchase(ListPaymentAttemptsByPurchaseRequest) returns (ListPaymentAttemptsByPurchaseResponse);

  rpc RefundPurchase(RefundPurchaseRequest) returns (RefundPurchaseResponse);
}
