syntax = "proto3";

package billing_service;

import "common/pagination.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/phanhotboy/nien-su-viet/libs/pkg/grpc/genproto/billing_service;billing_service";

// OutboxEventStatus represents the lifecycle state of an event in the outbox pattern.
// The outbox pattern ensures reliable event publishing by storing events in the database
// and processing them asynchronously.
enum OutboxEventStatus {
  // Unspecified status; should not be used
  OUTBOX_EVENT_STATUS_UNSPECIFIED = 0;
  // Event has been created but not yet published to message broker
  OUTBOX_EVENT_STATUS_PENDING = 1;
  // Event has been successfully published to message broker
  OUTBOX_EVENT_STATUS_PUBLISHED = 2;
  // Event publication failed; will be retried
  OUTBOX_EVENT_STATUS_FAILED = 3;
  // Event is currently being retried after a previous failure
  OUTBOX_EVENT_STATUS_RETRYING = 4;
  // Event reached maximum retry count; permanently failed and abandoned
  OUTBOX_EVENT_STATUS_DEAD = 5;
}

message OutboxEvent {
  string id = 1; // UUID

  string aggregate_type = 2;
  string aggregate_id = 3; // UUID-as-string

  string event_type = 4;

  // This should be a JSON-encoded string of the EventEnvelope.
  google.protobuf.Struct payload = 5;

  OutboxEventStatus status = 6;

  int32 retry_count = 7;

  google.protobuf.Timestamp next_retry_at = 8;

  google.protobuf.Timestamp published_at = 9;
  google.protobuf.Timestamp created_at = 10;
}

message GetOutboxEventRequest {
  string id = 1;
}

message GetOutboxEventResponse {
  OutboxEvent data = 1;
}

message ListOutboxEventsRequest {
  // filter examples
  OutboxEventStatus status = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListOutboxEventsResponse {
  repeated OutboxEvent data = 1;
  common.PaginationMetadata pagination = 2;
}

service OutboxService {
  rpc GetOutboxEvent(GetOutboxEventRequest) returns (GetOutboxEventResponse);
  rpc ListOutboxEvents(ListOutboxEventsRequest) returns (ListOutboxEventsResponse);
}
