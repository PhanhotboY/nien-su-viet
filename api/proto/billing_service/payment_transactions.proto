syntax = "proto3";

package billing_service;

import "billing_service/billing.proto";
import "common/pagination.proto";
import "common/request.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/phanhotboy/nien-su-viet/libs/pkg/grpc/genproto/billing_service;billing_service";

// PaymentTransactionType categorizes different types of payment-related transactions.
// These types represent different operations in the payment processing workflow.
enum PaymentTransactionType {
  // Unspecified type; should not be used
  PAYMENT_TRANSACTION_TYPE_UNSPECIFIED = 0;
  // Direct payment/charge transaction
  PAYMENT_TRANSACTION_TYPE_PAYMENT = 1;
  // Authorization-only transaction (hold without capturing funds)
  PAYMENT_TRANSACTION_TYPE_AUTH = 2;
  // Capture transaction (capture funds from a previous auth)
  PAYMENT_TRANSACTION_TYPE_CAPTURE = 3;
  // Refund transaction (return funds to customer)
  PAYMENT_TRANSACTION_TYPE_REFUND = 4;
  // Void transaction (cancel an auth or payment before capture)
  PAYMENT_TRANSACTION_TYPE_VOID = 5;
  // Chargeback transaction (customer dispute that results in fund reversal)
  PAYMENT_TRANSACTION_TYPE_CHARGEBACK = 6;
  // Adjustment transaction (fee adjustment, discount, or correction)
  PAYMENT_TRANSACTION_TYPE_ADJUSTMENT = 7;
  // Fee transaction (service charge or processing fee)
  PAYMENT_TRANSACTION_TYPE_FEE = 8;
}

// PaymentTransactionStatus tracks the processing state of a payment transaction.
enum PaymentTransactionStatus {
  // Unspecified status; should not be used
  PAYMENT_TRANSACTION_STATUS_UNSPECIFIED = 0;
  // Transaction has been created but not yet processed by provider
  PAYMENT_TRANSACTION_STATUS_PENDING = 1;
  // Transaction was successfully processed by provider
  PAYMENT_TRANSACTION_STATUS_SUCCEEDED = 2;
  // Transaction failed during processing
  PAYMENT_TRANSACTION_STATUS_FAILED = 3;
  // Transaction was canceled before completion
  PAYMENT_TRANSACTION_STATUS_CANCELED = 4;
}

message PaymentTransaction {
  string id = 1;

  string payment_attempt_id = 2;

  PaymentTransactionType type = 3;
  PaymentTransactionStatus status = 4;

  Money amount = 5;

  string provider_reference = 6;
  google.protobuf.Struct metadata = 7;

  google.protobuf.Timestamp processed_at = 8;
  google.protobuf.Timestamp created_at = 9;
}

// ============================================================================
// Transaction Query Service (optional but useful for support/reconciliation)
// ============================================================================

message ListPaymentTransactionsByPurchaseRequest {
  string purchase_id = 1;
  common.ListQueryRequest query = 2;
}

message ListPaymentTransactionsByPurchaseResponse {
  repeated PaymentTransaction data = 1;
  common.PaginationMetadata pagination = 2;
}

message ListPaymentTransactionsByAttemptRequest {
  string payment_attempt_id = 1;
  common.ListQueryRequest query = 2;
}

message ListPaymentTransactionsByAttemptResponse {
  repeated PaymentTransaction data = 1;
  common.PaginationMetadata pagination = 2;
}

service PaymentTransactionService {
  rpc ListByPurchase(ListPaymentTransactionsByPurchaseRequest) returns (ListPaymentTransactionsByPurchaseResponse);
  rpc ListByAttempt(ListPaymentTransactionsByAttemptRequest) returns (ListPaymentTransactionsByAttemptResponse);
}
