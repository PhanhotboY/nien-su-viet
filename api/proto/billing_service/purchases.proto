syntax = "proto3";

package billing_service;

import "billing_service/billing.proto";
import "billing_service/payment_attempts.proto";
import "common/pagination.proto";
import "common/request.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/phanhotboy/nien-su-viet/libs/pkg/grpc/genproto/billing_service;billing_service";

// PurchaseStatus represents the lifecycle state of a purchase transaction.
// A purchase progresses through these states during the payment and fulfillment process.
enum PurchaseStatus {
  // Unspecified status; should not be used
  PURCHASE_STATUS_UNSPECIFIED = 0;
  // User initiated checkout but has not yet completed payment
  PURCHASE_STATUS_PENDING = 1;
  // Payment completed successfully; webhook processed; new subscription period created
  PURCHASE_STATUS_COMPLETED = 2;
  // Payment processing failed; purchase will not result in subscription
  PURCHASE_STATUS_FAILED = 3;
  // Payment attempt expired before completion; purchase was abandoned
  PURCHASE_STATUS_CANCELED = 4;
}

message Purchase {
  string id = 1;

  string user_id = 2;
  string subscription_id = 3;
  string plan_id = 4;

  Money amount = 5;
  PurchaseStatus status = 6;

  string idempotency_key = 7;

  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp completed_at = 9;
}

// ============================================================================
// Purchase / Billing Service (invoices, renewals)
// ============================================================================

message CreatePurchaseRequest {
  string user_id = 1;
  string plan_id = 3;

  // Client-generated idempotency key to prevent duplicates.
  string idempotency_key = 5;
}

message CreatePurchaseResponse {
  string id = 1;
  int32 return_code = 2;
  string return_message = 3;
  int32 sub_return_code = 4;
  string sub_return_message = 5;

  PaymentAttempt payment_attempt = 6;
}

message GetPurchaseRequest {
  string id = 1;
}

message GetPurchaseResponse {
  Purchase data = 1;
}

message ListPurchasesBySubscriptionRequest {
  string subscription_id = 1;
  common.ListQueryRequest query = 2;
}

message ListPurchasesBySubscriptionResponse {
  repeated Purchase data = 1;
  common.PaginationMetadata pagination = 2;
}

message ListPurchasesByUserRequest {
  string user_id = 1;
  common.ListQueryRequest query = 2;
}

message ListPurchasesByUserResponse {
  repeated Purchase data = 1;
  common.PaginationMetadata pagination = 2;
}

service PurchaseService {
  rpc CreatePurchase(CreatePurchaseRequest) returns (CreatePurchaseResponse);
  rpc GetPurchase(GetPurchaseRequest) returns (GetPurchaseResponse);
  rpc ListPurchasesBySubscription(ListPurchasesBySubscriptionRequest) returns (ListPurchasesBySubscriptionResponse);
  rpc ListPurchasesByUser(ListPurchasesByUserRequest) returns (ListPurchasesByUserResponse);
}
